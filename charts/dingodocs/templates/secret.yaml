{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dingodocs.secretName" . }}
  labels:
    {{- include "dingodocs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ required (printf "secretEnv.%s is required when existingSecret is empty" $key) $value | quote }}
  {{- end }}
{{- end }}
